# Module: slate_ntfs_kernel.package
# Purpose: Configure the freestanding Rust kernel adapter.
# Created: 2026-10-02
# Architecture: Builds the static adapter from freestanding.rs; the C VFS bridge links its
# exported callbacks.

[package]
name = "slate-ntfs-kernel"
version = "0.7.3"
edition = "2021"
license = "MIT OR GPL-2.0-only"

[lib]
path = "../freestanding.rs"
crate-type = ["staticlib"]

[profile.release]
panic = "abort"
opt-level = 2
lto = false
codegen-units = 1
overflow-checks = true

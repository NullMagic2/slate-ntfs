# Module: packaging.deb.dkms
# Purpose: Configure DKMS builds for the Slate NTFS kernel module.
# Created: 2026-10-02
# Architecture: DKMS calls dkms-build.sh; the kernel build links the C bridge and Rust adapter.

PACKAGE_NAME="slate-ntfs"
PACKAGE_VERSION="0.6.7-2"
BUILT_MODULE_NAME[0]="ntfs_rs"
BUILT_MODULE_LOCATION[0]="kernel"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
MAKE[0]="/bin/bash ./dkms-build.sh ${kernelver}"
CLEAN="/bin/true"

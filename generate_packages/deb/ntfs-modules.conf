# Module: packaging.deb.module_policy
# Purpose: Disable competing loadable NTFS drivers for packaged installations.
# Created: 2026-10-02
# Architecture: Modprobe reads this package configuration; built-in driver selection remains a
# kernel configuration decision.

# Keep Ubuntu's loadable NTFS drivers out of future boots and explicit modprobe.
# Built-in kernel drivers cannot be unloaded or removed by a Debian package.
blacklist ntfs
blacklist ntfs3
install ntfs /bin/false
install ntfs3 /bin/false
